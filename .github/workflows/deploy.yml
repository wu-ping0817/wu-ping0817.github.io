# 部署到 GitHub Pages
# 触发：push 到 main 分支，或手动（Actions 页面 → Run workflow）
# 说明：
#   - 仓库名必须为「<你的GitHub用户名>.github.io」（用户页），与 vite.config.js 的 base: '/' 对应。
#     若改为项目页，仓库名任意、base 需为 '/<仓库名>/'。
#   - 部署前请在仓库 Settings → Pages → Source 选择 "GitHub Actions"。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 发布 Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署，避免并发互相覆盖
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
